services:
  mongo-test:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27018:27017"
    volumes:
      - mongo_test_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval "try { quit(rs.status().ok ? 0 : 1) } catch (e) { quit(rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok ? 0 : 1) }"
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s

volumes:
  mongo_test_data:
