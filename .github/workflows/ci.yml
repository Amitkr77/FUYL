name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: typecheck / lint (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [fuyl-backend, fuyl-frontend, fuyl-admin, fuyl-assessment]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install
        run: npm ci

      # Type safety is enforced (currently green for all three apps).
      - name: Typecheck
        run: npx tsc --noEmit

      # Lint is informational for now — flip continue-on-error to false once the
      # existing lint debt is cleared, to make it a required gate.
      - name: Lint
        run: npm run lint
        continue-on-error: true

  backend-build:
    name: backend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fuyl-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fuyl-backend/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build

  # NOTE: fuyl-frontend / fuyl-admin `next build` is intentionally omitted here
  # because it fetches from a live backend during static generation. Run those
  # builds in an environment with backend access (or with fixture data) before
  # deploying. Backend integration/e2e tests also need live Mongo + Redis —
  # add them here with service containers when ready.

  assessment-test-build:
    name: assessment tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fuyl-assessment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fuyl-assessment/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      # The assessment app has no build-time dependency on a live backend or
      # database (env is validated lazily at request time), so it builds in CI.
      - name: Build
        run: npm run build

  # End-to-end (Playwright) suite for the assessment. Fully self-contained:
  # e2e/server.ts starts an in-memory MongoDB and a local stand-in for fuyl.in,
  # so no secrets, database or live store are needed.
  assessment-e2e:
    name: assessment e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: fuyl-assessment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fuyl-assessment/package-lock.json
      - run: npm ci
      - name: Cache MongoDB binary (mongodb-memory-server)
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('fuyl-assessment/package-lock.json') }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Run e2e suite
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            fuyl-assessment/playwright-report
            fuyl-assessment/test-results
          retention-days: 7
